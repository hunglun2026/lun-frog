<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兩棲小百科｜兩棲探險家</title>
<meta name="description" content="水利署在臺灣溪流記錄到的 31 種兩棲類：依年級看白話介紹、學名、科別、在哪些流域與月份被記錄，還能挑兩種比一比。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css?v=1">
<link rel="stylesheet" href="/css/base.css?v=1">
<link rel="stylesheet" href="/css/site.css?v=1">
</head>
<body data-page="frogs">
<main>
  <h1>📖 兩棲小百科</h1>
  <p class="lead">輸入名字找蛙，或用下面的按鈕篩選。點一下看詳細介紹，還可以挑兩種「比一比」。頁首選「低年級」會加上注音。</p>
  <section id="cmp" hidden></section>
  <input type="search" id="q" placeholder="輸入名字或學名，例如：莫氏樹蛙、Rana" aria-label="搜尋兩棲類">
  <div class="filters" id="filters"></div>
  <p id="count" class="lead" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div id="cmpbar" class="cmpbar noprint" hidden></div>
  <dialog id="dlg"><div class="dlg-in" id="dlg-body"></div></dialog>
</main>
<script src="/js/site.js?v=1"></script>
<script src="/js/core/app.js?v=1"></script>
<script src="/js/core/layout.js?v=1"></script>
<script src="/js/core/fx.js?v=1"></script>
<script src="/js/zhuyin.js?v=1"></script>
<script src="/js/core/progress.js?v=1"></script>
<script src="/js/p-frogs.js?v=1"></script>
</body>
</html>
